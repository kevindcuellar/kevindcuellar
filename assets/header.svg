<svg width="100%" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="80" y1="30" x2="1120" y2="290" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8F8F6"/>
      <stop offset="0.5" stop-color="#ECECE8"/>
      <stop offset="1" stop-color="#E2E2DD"/>
    </linearGradient>

    <linearGradient id="shineGrad" x1="0" y1="0" x2="260" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="white" stop-opacity="0"/>
      <stop offset="0.5" stop-color="white" stop-opacity="0.32"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <pattern id="linePattern" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M0 14 L14 0" stroke="#000000" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.12"/>
    </filter>

    <radialGradient id="orbLeft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(120 160) rotate(90) scale(120 120)">
      <stop stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orbRight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(1080 160) rotate(90) scale(120 120)">
      <stop stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- decoracion lateral -->
  <circle cx="110" cy="160" r="110" fill="url(#orbLeft)">
    <animate attributeName="cx" values="100;120;100" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="8s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1090" cy="160" r="100" fill="url(#orbRight)">
    <animate attributeName="cx" values="1100;1080;1100" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.95;0.7" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- bloque principal -->
  <rect x="140" y="40" width="920" height="210" rx="70" fill="url(#bgGrad)" filter="url(#softShadow)"/>
  <rect x="140" y="40" width="920" height="210" rx="70" fill="url(#linePattern)"/>

  <!-- brillo animado -->
  <rect x="-260" y="40" width="260" height="210" rx="70" fill="url(#shineGrad)" opacity="0.9">
    <animate attributeName="x" from="-260" to="1320" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- borde suave -->
  <rect x="140.5" y="40.5" width="919" height="209" rx="69.5" stroke="#000000" stroke-opacity="0.06"/>

  <!-- nombre -->
  <text x="600" y="115"
        text-anchor="middle"
        font-family="Montserrat, Arial, sans-serif"
        font-size="42"
        font-weight="700"
        fill="#000000">
    Kevin Daniel Cuellar
  </text>

  <!-- linea -->
  <line x1="535" y1="138" x2="665" y2="138" stroke="#111111" stroke-width="1.6" stroke-linecap="round" opacity="0.7">
    <animate attributeName="opacity" values="0.45;0.85;0.45" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- DATA ANALYST -->
  <g transform="translate(255,170)">
    <rect width="185" height="42" rx="13" fill="#FFFFFF" stroke="#D4D4CF"/>
    <rect x="16" y="22" width="4" height="10" rx="2" fill="#111111"/>
    <rect x="22" y="17" width="4" height="15" rx="2" fill="#111111"/>
    <rect x="28" y="12" width="4" height="20" rx="2" fill="#111111"/>
    <text x="108" y="27"
          text-anchor="middle"
          font-family="Montserrat, Arial, sans-serif"
          font-size="15"
          font-weight="700"
          letter-spacing="1.6"
          fill="#000000">
      DATA ANALYST
    </text>
  </g>

  <!-- BACKEND -->
  <g transform="translate(465,170)">
    <rect width="280" height="42" rx="13" fill="#FAFAF8" stroke="#CECEC8"/>
    <path d="M20 13 L14 21 L20 29" stroke="#111111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M34 13 L40 21 L34 29" stroke="#111111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M28 12 L25 30" stroke="#111111" stroke-width="2.2" stroke-linecap="round"/>
    <text x="164" y="27"
          text-anchor="middle"
          font-family="Montserrat, Arial, sans-serif"
          font-size="15"
          font-weight="700"
          letter-spacing="1.2"
          fill="#000000">
      BACKEND DEVELOPER
    </text>
  </g>

  <!-- AUTOMATION -->
  <g transform="translate(770,170)">
    <rect width="175" height="42" rx="13" fill="#F3F3F1" stroke="#CBCBC5"/>
    <circle cx="22" cy="21" r="6" stroke="#111111" stroke-width="2"/>
    <circle cx="22" cy="21" r="2" fill="#111111"/>
    <path d="M22 10V13" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
    <path d="M22 29V32" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
    <path d="M11 21H14" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
    <path d="M30 21H33" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
    <path d="M14.5 13.5L16.5 15.5" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
    <path d="M27.5 26.5L29.5 28.5" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
    <path d="M29.5 13.5L27.5 15.5" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
    <path d="M16.5 26.5L14.5 28.5" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
    <text x="104" y="27"
          text-anchor="middle"
          font-family="Montserrat, Arial, sans-serif"
          font-size="15"
          font-weight="700"
          letter-spacing="1.2"
          fill="#000000">
      AUTOMATION
    </text>
  </g>
</svg>
