<svg width="100%" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="orbSoft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(0 0) rotate(90) scale(1)">
      <stop stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#E8E8E3" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orbGray" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(0 0) rotate(90) scale(1)">
      <stop stop-color="#F4F4F1" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#DADAD4" stop-opacity="0"/>
    </radialGradient>

    <pattern id="gridPattern" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#000000" opacity="0.05"/>
    </pattern>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- fondo decorativo de puntos -->
  <rect x="0" y="0" width="1200" height="340" fill="url(#gridPattern)" opacity="0.35"/>

  <!-- círculos grandes -->
  <circle cx="180" cy="105" r="84" fill="#F5F5F2" opacity="0.95" filter="url(#softShadow)"/>
  <circle cx="1020" cy="96" r="72" fill="#EFEFEA" opacity="0.95" filter="url(#softShadow)"/>
  <circle cx="130" cy="250" r="54" fill="#FAFAF8" opacity="0.95"/>
  <circle cx="1080" cy="245" r="62" fill="#F1F1ED" opacity="0.95"/>

  <!-- círculos medios -->
  <circle cx="315" cy="78" r="24" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="885" cy="70" r="18" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="930" cy="255" r="20" fill="#F3F3F0" opacity="0.9"/>
  <circle cx="265" cy="250" r="16" fill="#FFFFFF" opacity="0.9"/>

  <!-- ondas expansivas izquierda -->
  <circle cx="170" cy="110" r="32" stroke="#000000" stroke-opacity="0.10" stroke-width="1.4">
    <animate attributeName="r" values="32;58;32" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.16;0.02;0.16" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="170" cy="110" r="48" stroke="#000000" stroke-opacity="0.07" stroke-width="1.2">
    <animate attributeName="r" values="48;76;48" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.10;0.01;0.10" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- ondas expansivas derecha -->
  <circle cx="1030" cy="98" r="26" stroke="#000000" stroke-opacity="0.10" stroke-width="1.4">
    <animate attributeName="r" values="26;52;26" dur="4.8s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.14;0.02;0.14" dur="4.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1030" cy="98" r="42" stroke="#000000" stroke-opacity="0.06" stroke-width="1.1">
    <animate attributeName="r" values="42;70;42" dur="4.8s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.08;0.01;0.08" dur="4.8s" repeatCount="indefinite"/>
  </circle>

  <!-- glow suave central -->
  <ellipse cx="600" cy="120" rx="310" ry="92" fill="#F8F8F5" opacity="0.95" filter="url(#softShadow)"/>
  <ellipse cx="600" cy="120" rx="260" ry="68" fill="#FFFFFF" opacity="0.55"/>

  <!-- brillo animado sutil -->
  <ellipse cx="-180" cy="120" rx="120" ry="70" fill="#FFFFFF" opacity="0.22">
    <animate attributeName="cx" from="-180" to="1380" dur="7s" repeatCount="indefinite"/>
  </ellipse>

  <!-- nombre -->
  <text x="600" y="118"
        text-anchor="middle"
        font-family="Montserrat, Arial, sans-serif"
        font-size="44"
        font-weight="700"
        fill="#000000">
    Kevin Daniel Cuellar
  </text>

  <!-- línea -->
  <line x1="530" y1="142" x2="670" y2="142" stroke="#000000" stroke-width="1.5" stroke-linecap="round" opacity="0.55">
    <animate attributeName="opacity" values="0.35;0.75;0.35" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- DATA ANALYST -->
  <g transform="translate(255,182)">
    <rect width="185" height="42" rx="14" fill="#FFFFFF" stroke="#D0D0CB" filter="url(#softShadow)"/>
    <rect x="16" y="22" width="4" height="10" rx="2" fill="#111111"/>
    <rect x="22" y="17" width="4" height="15" rx="2" fill="#111111"/>
    <rect x="28" y="12" width="4" height="20" rx="2" fill="#111111"/>
    <text x="108" y="27"
          text-anchor="middle"
          font-family="Montserrat, Arial, sans-serif"
          font-size="15"
          font-weight="700"
          letter-spacing="1.5"
          fill="#000000">
      DATA ANALYST
    </text>
  </g>

  <!-- BACKEND DEVELOPER -->
  <g transform="translate(465,182)">
    <rect width="280" height="42" rx="14" fill="#FAFAF8" stroke="#CACAC4" filter="url(#softShadow)"/>
    <path d="M20 13 L14 21 L20 29" stroke="#111111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M34 13 L40 21 L34 29" stroke="#111111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M28 12 L25 30" stroke="#111111" stroke-width="2.2" stroke-linecap="round"/>
    <text x="164" y="27"
          text-anchor="middle"
          font-family="Montserrat, Arial, sans-serif"
          font-size="15"
          font-weight="700"
          letter-spacing="1.15"
          fill="#000000">
      BACKEND DEVELOPER
    </text>
  </g>

  <!-- AUTOMATION -->
  <g transform="translate(770,182)">
    <rect width="175" height="42" rx="14" fill="#F2F2EF" stroke="#C8C8C2" filter="url(#softShadow)"/>
    <circle cx="22" cy="21" r="6" stroke="#111111" stroke-width="2"/>
    <circle cx="22" cy="21" r="2" fill="#111111"/>
    <path d="M22 10V13" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
    <path d="M22 29V32" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
    <path d="M11 21H14" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
    <path d="M30 21H33" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
    <path d="M14.5 13.5L16.5 15.5" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
    <path d="M27.5 26.5L29.5 28.5" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
    <path d="M29.5 13.5L27.5 15.5" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
    <path d="M16.5 26.5L14.5 28.5" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
    <text x="104" y="27"
          text-anchor="middle"
          font-family="Montserrat, Arial, sans-serif"
          font-size="15"
          font-weight="700"
          letter-spacing="1.15"
          fill="#000000">
      AUTOMATION
    </text>
  </g>
</svg>
