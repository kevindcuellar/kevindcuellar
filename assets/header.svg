<svg width="900" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="110" y1="20" x2="790" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F7F5"/>
      <stop offset="0.5" stop-color="#ECECE8"/>
      <stop offset="1" stop-color="#E4E4DF"/>
    </linearGradient>

    <linearGradient id="shineGrad" x1="0" y1="0" x2="220" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="white" stop-opacity="0"/>
      <stop offset="0.5" stop-color="white" stop-opacity="0.28"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <pattern id="linePattern" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 12 L12 0" stroke="#000000" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- contenedor principal -->
  <rect x="110" y="20" width="680" height="160" rx="55" fill="url(#bgGrad)" filter="url(#softShadow)"/>
  <rect x="110" y="20" width="680" height="160" rx="55" fill="url(#linePattern)"/>

  <!-- brillo animado -->
  <rect x="-180" y="20" width="180" height="160" rx="55" fill="url(#shineGrad)" opacity="0.8">
    <animate attributeName="x" from="-180" to="920" dur="5.5s" repeatCount="indefinite"/>
  </rect>

  <!-- nombre -->
  <text x="450" y="76"
        text-anchor="middle"
        font-family="Montserrat, Arial, sans-serif"
        font-size="34"
        font-weight="700"
        fill="#000000">
    Kevin Daniel Cuellar
  </text>

  <!-- línea divisora -->
  <line x1="407" y1="94" x2="493" y2="94" stroke="#111111" stroke-width="1.4" stroke-linecap="round" opacity="0.7">
    <animate attributeName="opacity" values="0.45;0.8;0.45" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- DATA ANALYST -->
  <g transform="translate(180,108)">
    <rect width="150" height="34" rx="11" fill="#FFFFFF" stroke="#CFCFC8"/>

    <rect x="12" y="18" width="3" height="8" rx="1.5" fill="#111111"/>
    <rect x="17" y="14" width="3" height="12" rx="1.5" fill="#111111"/>
    <rect x="22" y="10" width="3" height="16" rx="1.5" fill="#111111"/>

    <text x="89" y="22"
          text-anchor="middle"
          font-family="Montserrat, Arial, sans-serif"
          font-size="13"
          font-weight="700"
          letter-spacing="1.3"
          fill="#000000">
      DATA ANALYST
    </text>
  </g>

  <!-- BACKEND DEVELOPER -->
  <g transform="translate(345,108)">
    <rect width="220" height="34" rx="11" fill="#FAFAF8" stroke="#C9C9C2"/>

    <path d="M18 11 L13 17 L18 23" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M30 11 L35 17 L30 23" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M24 10 L22 24" stroke="#111111" stroke-width="2" stroke-linecap="round"/>

    <text x="132" y="22"
          text-anchor="middle"
          font-family="Montserrat, Arial, sans-serif"
          font-size="13"
          font-weight="700"
          letter-spacing="1"
          fill="#000000">
      BACKEND DEVELOPER
    </text>
  </g>

  <!-- AUTOMATION -->
  <g transform="translate(580,108)">
    <rect width="140" height="34" rx="11" fill="#F3F3F0" stroke="#C8C8C1"/>

    <circle cx="18" cy="17" r="5" stroke="#111111" stroke-width="2"/>
    <circle cx="18" cy="17" r="1.8" fill="#111111"/>
    <path d="M18 8.5V11" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
    <path d="M18 23V25.5" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
    <path d="M10 17H12.5" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
    <path d="M23.5 17H26" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
    <path d="M12.8 11.8L14.5 13.5" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
    <path d="M21.5 20.5L23.2 22.2" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
    <path d="M23.2 11.8L21.5 13.5" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
    <path d="M14.5 20.5L12.8 22.2" stroke="#111111" stroke-width="2" stroke-linecap="round"/>

    <text x="86" y="22"
          text-anchor="middle"
          font-family="Montserrat, Arial, sans-serif"
          font-size="13"
          font-weight="700"
          letter-spacing="1.05"
          fill="#000000">
      AUTOMATION
    </text>
  </g>
</svg>
